[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-dataset-validator"
version = "0.1.0"
description = "Dataset validation toolkit for custom LeRobot-shaped datasets"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "opencv-python-headless>=4.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]