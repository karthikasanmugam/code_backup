model:
  type: act
  checkpoint: null
  device: cuda

  n_obs_steps: 1
  chunk_size: 50
  n_action_steps: 50

  input_features:
    observation.state:
      type: STATE
      shape: [16]

    observation.leader_state:
      type: STATE
      shape: [16]

    observation.images.world:
      type: VISUAL
      shape: [3, 240, 320]



    observation.images.wrist_right:
      type: VISUAL
      shape: [3, 240, 320]

    observation.images.wrist_left:
      type: VISUAL
      shape: [3, 240, 320]

  output_features:
    action:
      type: ACTION
      shape: [16]

  normalization_mapping:
    VISUAL: MEAN_STD
    STATE: MEAN_STD
    ACTION: MEAN_STD

  vision_backbone: resnet18
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  replace_final_stride_with_dilation: false
  pre_norm: false
  dim_model: 512
  n_heads: 8
  dim_feedforward: 3200
  feedforward_activation: relu
  n_encoder_layers: 4
  n_decoder_layers: 1
  use_vae: true
  latent_dim: 32
  n_vae_encoder_layers: 4
  temporal_ensemble_coeff: null
  dropout: 0.1
  kl_weight: 10.0

inference:
  deterministic: true
  use_amp: false
